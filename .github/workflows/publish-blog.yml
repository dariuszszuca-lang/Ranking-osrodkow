name: Publish Scheduled Blog Article

on:
  schedule:
    # Run at 8:00 AM Polish time (7:00 UTC in winter, 6:00 UTC in summer)
    # Monday, Wednesday, Friday
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to publish (YYYY-MM-DD), leave empty for today'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Ranking-osrodkow
        uses: actions/checkout@v4
        with:
          path: ranking
          token: ${{ secrets.GH_PAT }}

      - name: Checkout katalog-o-rodk-w
        uses: actions/checkout@v4
        with:
          repository: dariuszszuca-lang/katalog-o-rodk-w
          path: katalog
          token: ${{ secrets.GH_PAT }}

      - name: Checkout eduway-site
        uses: actions/checkout@v4
        with:
          repository: dariuszszuca-lang/eduway-site
          path: eduway
          token: ${{ secrets.GH_PAT }}

      - name: Checkout myway-revived-vision
        uses: actions/checkout@v4
        with:
          repository: dariuszszuca-lang/myway-revived-vision
          path: osrodek
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get current date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Check for scheduled article
        id: check
        run: |
          if [ -f "ranking/scheduled/${{ steps.date.outputs.date }}.json" ]; then
            echo "has_article=true" >> $GITHUB_OUTPUT
            echo "Found article for ${{ steps.date.outputs.date }}"
          else
            echo "has_article=false" >> $GITHUB_OUTPUT
            echo "No article scheduled for ${{ steps.date.outputs.date }}"
          fi

      - name: Generate articles
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          node scripts/publish-article.cjs ${{ steps.date.outputs.date }}

      - name: Update Ranking blog index
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          node scripts/update-blog-index.cjs ${{ steps.date.outputs.date }}

      - name: Update Katalog blog index
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          node scripts/update-katalog-index.cjs ${{ steps.date.outputs.date }}

      - name: Update EduWay blog index
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          node scripts/update-eduway-index.cjs ${{ steps.date.outputs.date }}

      - name: Update Osrodek App.tsx
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          node scripts/update-osrodek-app.cjs ${{ steps.date.outputs.date }}

      - name: Update Osrodek Blog and EduWay feeds
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          node scripts/update-osrodek-feeds.cjs ${{ steps.date.outputs.date }}

      - name: Commit and push Ranking
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          git config user.name "Blog Publisher"
          git config user.email "bot@katalogosrodkow.pl"
          git add -A
          git diff --staged --quiet || git commit -m "Publish: $(cat scheduled/${{ steps.date.outputs.date }}.json | jq -r '.title')"
          git push

      - name: Commit and push Katalog
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd katalog
          git config user.name "Blog Publisher"
          git config user.email "bot@katalogosrodkow.pl"
          git add -A
          git diff --staged --quiet || git commit -m "Publish: $(cat ../ranking/scheduled/${{ steps.date.outputs.date }}.json | jq -r '.title')"
          git push

      - name: Commit and push EduWay
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd eduway
          git config user.name "Blog Publisher"
          git config user.email "bot@katalogosrodkow.pl"
          git add -A
          git diff --staged --quiet || git commit -m "Publish: $(cat ../ranking/scheduled/${{ steps.date.outputs.date }}.json | jq -r '.title')"
          git push

      - name: Commit and push Osrodek
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd osrodek
          git config user.name "Blog Publisher"
          git config user.email "bot@katalogosrodkow.pl"
          git add -A
          git diff --staged --quiet || git commit -m "Publish: $(cat ../ranking/scheduled/${{ steps.date.outputs.date }}.json | jq -r '.title')"
          git push

      - name: Mark article as published
        if: steps.check.outputs.has_article == 'true'
        run: |
          cd ranking
          mkdir -p published
          mv scheduled/${{ steps.date.outputs.date }}.json published/
          git add -A
          git commit -m "Mark article as published: ${{ steps.date.outputs.date }}"
          git push
